services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "127.0.0.1:8787:8787"

  caddy:
    profiles: [public]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
