services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 运营数据（ADR 0015）：放在命名 volume 里，重新部署换版本目录也不丢
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./.private-credits:/app/.private-credits:ro
      - app_data:/app/data

  caddy:
    profiles: [public]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${EDGE_DIR:-./.edge}/sites:/etc/caddy/sites:ro
      - ${EDGE_DIR:-./.edge}/www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
