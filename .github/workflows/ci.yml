name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check all packages
        run: pnpm typecheck

      - name: Build client
        run: pnpm build:client

      # 默认场景：真人加入电脑房间并开局，覆盖构建产物、服务端和浏览器之间的整条链路
      - name: Run browser UI check
        env:
          CHROME: /usr/bin/google-chrome
          NO_BUILD: '1'
        run: |
          # Ubuntu 24.04 的 AppArmor 默认禁止 Chrome 沙箱需要的非特权用户命名空间
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          pnpm ui-check

      - name: Check deployment package without Windows
        run: ./deploy.sh -Check -Revision "$GITHUB_SHA"

  deploy-scripts:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Windows deployment package
        shell: pwsh
        run: .\deploy.cmd -Check -Revision $env:GITHUB_SHA

      - name: Check Bash syntax after Windows checkout
        shell: bash
        run: |
          bash -n scripts/deploy-private-remote.sh
          bash -n scripts/pr-review/review.sh
