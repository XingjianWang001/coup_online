name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check all packages
        run: pnpm typecheck

      - name: Build client
        run: pnpm build:client

  deploy-scripts:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Windows deployment package
        shell: pwsh
        run: .\deploy.cmd -Check -Revision $env:GITHUB_SHA

      - name: Check Bash syntax after Windows checkout
        shell: bash
        run: |
          bash -n scripts/deploy-private-remote.sh
          bash -n scripts/pr-review/review.sh
